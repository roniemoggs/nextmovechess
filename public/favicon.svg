<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#0070f3" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <linearGradient id="knight-grad" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="arrow-grad" x1="24" y1="24" x2="44" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Badge with Vibrant Glow Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)" />
  <rect x="5" y="5" width="54" height="54" rx="13" fill="#090a10" />

  <!-- Subtle ambient inner light -->
  <circle cx="20" cy="18" r="18" fill="#00f2fe" opacity="0.15" />
  
  <!-- Knight Chess Piece (Tactical Forward Profile) -->
  <g filter="url(#glow)">
    <!-- Base Plate -->
    <path
      d="M16 51C16 49 18 47 21 47H43C46 47 48 49 48 51V52C48 53 47 54 46 54H18C17 54 16 53 16 52V51Z"
      fill="url(#knight-grad)"
    />
    
    <!-- Knight Mane & Head Structure -->
    <path
      d="M19 45L21.5 33C22 30 21.5 27 20 24L19 22C18.2 20.5 18.5 19 19.8 18L26.5 12C28 10.7 30 11 31.2 12.5L33 15C33.7 16 35 16.5 36.2 16.2L42.5 15.2C44.5 14.8 46.2 16.2 46.5 18.2L47 21.5C47.3 23.5 46.5 25.5 44.5 26.8L39 30.5L44.5 45H19Z"
      fill="url(#knight-grad)"
    />

    <!-- Forward Tactical Vector Chevron (Next Move Indicator) -->
    <path
      d="M27 28L34 34.5L27 41"
      stroke="url(#arrow-grad)"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Intelligent Engine Focus Eye -->
    <circle cx="36" cy="20.5" r="2.2" fill="#ffffff" />
  </g>
</svg>
