<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background / Border Gradient -->
    <linearGradient id="logo-border-grad" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#0070f3" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <!-- Knight Fill Gradient -->
    <linearGradient id="logo-knight-grad" x1="16" y1="16" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <!-- Tactical Vector Arrow Gradient -->
    <linearGradient id="logo-arrow-grad" x1="30" y1="30" x2="56" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <!-- Text Accent Gradient -->
    <linearGradient id="logo-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <!-- Soft Glow Filter -->
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Container (x=10, y=10, w=80, h=80) -->
  <g transform="translate(10, 10)">
    <!-- Outer Glow Border -->
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#logo-border-grad)" />
    <!-- Inner Dark Badge with ambient illumination -->
    <rect x="3" y="3" width="74" height="74" rx="17" fill="#0b0c14" />
    <circle cx="28" cy="24" r="24" fill="#00f2fe" opacity="0.18" />

    <!-- Knight Figure & Forward Arrow -->
    <g filter="url(#logo-glow)">
      <!-- Base Plate -->
      <path
        d="M20 64C20 61.5 22.5 59 26 59H54C57.5 59 60 61.5 60 64V65C60 66.5 58.5 68 57 68H23C21.5 68 20 66.5 20 65V64Z"
        fill="url(#logo-knight-grad)"
      />
      <!-- Knight Body Silhouette -->
      <path
        d="M24 56.5L27 41.5C27.8 37.8 27.2 34 25.3 30.2L24 27.7C23 25.8 23.4 24 25 22.7L33.3 15.2C35.2 13.5 37.7 13.9 39.2 15.8L41.5 19C42.4 20.2 44 20.8 45.5 20.5L53.3 19.2C55.8 18.7 58 20.5 58.3 23L59 27.1C59.4 29.6 58.4 32.1 55.9 33.7L49 38.3L56 56.5H24Z"
        fill="url(#logo-knight-grad)"
      />
      <!-- Tactical Forward Vector Arrow (Next Move) -->
      <path
        d="M34 35L43 43.5L34 52"
        stroke="url(#logo-arrow-grad)"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <!-- Focus Eye -->
      <circle cx="45.5" cy="26" r="2.8" fill="#ffffff" />
    </g>
  </g>

  <!-- Wordmark Text Group -->
  <g transform="translate(108, 0)">
    <text
      x="0"
      y="58"
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif"
      font-size="36"
      font-weight="800"
      letter-spacing="-1.2"
      fill="#ffffff"
    >
      Next Move
    </text>
    <text
      x="195"
      y="58"
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif"
      font-size="36"
      font-weight="800"
      letter-spacing="-1.2"
      fill="url(#logo-text-grad)"
    >
      Chess
    </text>
    <!-- Tagline -->
    <text
      x="2"
      y="78"
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif"
      font-size="11"
      font-weight="600"
      letter-spacing="2.5"
      fill="#71717a"
    >
      AI ENGINE &amp; POSITION ANALYZER
    </text>
  </g>
</svg>
